<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-COMPATIBLE" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>CRUD Cidades</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body>

    <div class="container-fluid">
        <div class="jumbotron mt-5">
            <h1>GERENCIAMENTO DE CIDADES</h1>
            <p>UM CRUD PARA CRIAR, ALTERAR, EXCLUIR E LISTAR CIDADES</p>
        </div>

        <form action="/cidades" method="post" class="form-group">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" class="form-control" id="nome" aria-describedby="emailHelp" placeholder="Informe o nome da cidade">
            </div>
            <div class="form-group">
                <label for="estado">Estado:</label>
                <input type="text" class="form-control" id="estado" aria-describedby="emailHelp" placeholder="Informe o estado ao qual a cidade pertence">
            </div>
            <button type="submit" class="btn btn-outline-secondary">CRIAR</button>
        </form>
        <table class="table table-striped table-hover mt-5">
            <thead class="thead-dark">
            <tr>
                <th>Nome</th>
                <th>Estado</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td></td>
                <td></td>
                <td>
                    <div class="d-flex d-justify-content-center">
                        <a href="" class="btn btn-warning mr-3">ALTERAR</a>
                        <a href="" class="btn btn-danger mr-3">EXCLUIR</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>


    </div>

</body>
</html>
