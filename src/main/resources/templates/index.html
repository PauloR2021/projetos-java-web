<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   shrink-to-fit=no">


    <title>CRUD Cidades</title>
    <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

</head>
<body>
    <div class="container">

        <!-- CABEÇALHO -->

        <div class="jumbotron mt-5">
            <h1>GERENCIAMENTO DE CIDADES</h1>
            <p>
                CRUD para Criar, Alterar, Excluir e Listar Cidades.
            </p>
        </div>

        <!-- MENSAGEM DE SUCESSO QUANDO CADASTRADO NOVA CIDADE -->

        <div
                th:if="${mensagem}"
                class="alert alert-success"
                role="alert">

            <span th:text="${mensagem}"></span>

        </div>

        <!-- MENSAGEM DE ERRO QUANDO CADASTRADO NOVA CIDADE -->

        <div
                th:if="${error}"
                class="alert alert-danger"
                role="alert">
            <span th:text="${error}"></span>

        </div>

        <!-- FORMULÁRIO -->
        <div class="card">
            <div class="card-header">
                <h4>Cadastrar Cidade</h4>
            </div>

            <div class="card-body">
                <form
                    th:action="@{/cidades}"
                    method="post">

                    <!-- NOME -->
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input
                            type="text"
                            class="form-control"
                            id="nome"
                            name="nome"
                            placeholder="Informe o nome da Cidade"
                            required>
                    </div>

                    <!-- ESTADO -->
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <input
                                type="text"
                                class="form-control"
                                id="estado"
                                name="estado"
                                placeholder="Informe o Estado"
                                required>
                    </div>

                    <!-- BOTÃO SALVAR -->
                    <button type="submit" class="btn btn-outline-primary">Cadastrar</button>
                </form>
            </div>
        </div>

        <!-- TABELA -->
        <div class="card mt-5">
            <div class="card-header">
                <h4>Cidades Cadastradas</h4>
            </div>
            <div class="card-body">
                <table  class="table table-striped table-hover">
                    <thead class="thead-dark">
                    <tr>
                        <td>ID</td>
                        <td>Nome</td>
                        <td>Estado</td>
                        <td>Ações</td>
                    </tr>
                    </thead>

                    <!-- FAZ A INSERÇÃO DOS DADOS -->
                    <tbody>
                    <tr th:each="cidade : ${cidades}">
                        <td th:text="${cidade.id}"></td>
                        <td th:text="${cidade.nome}"></td>
                        <td th:text="${cidade.estado}"></td>
                        <td>
                            <div class="d-flex">
                                <!-- BTN ALTERAR-->
                                <a
                                        th:href="@{/cidades/editar/{id}(id=${cidade.id})}"
                                        class="btn btn-warning mr-2">ALTERAR
                                </a>

                                <!-- BTN EXCLUIR - COMO O METODO DE DELETAR NO HMTL E POST O BUTTON NECESSITA ESTAR NO FORM-->
                                <form
                                        th:action="@{/cidades/excluir/{id}(id=${cidade.id})}"
                                        method="post"
                                        style="display: inline"
                                >
                                    <button
                                            type="submit"
                                            class="btn btn-danger mr-2"> EXCLUIR
                                    </button>

                                </form>

                            </div>
                        </td>
                    </tr>

                    <!-- CASO NÃO TENHA CIDADES -->
                    <tr th:if="${#lists.isEmpty(cidades)}">
                        <td
                                colspan="4"
                                class="text-center">
                            Nenhuma Cidade Cadastrada
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT BOOTSTRAP -->
    <script
            src="https://code.jquery.com/jquery-3.4.1.slim.min.js">
    </script>

    <script
            src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js">
    </script>

    <script
            src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js">
    </script>
</body>
</html>
